<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .container-box{
            background:white;
            margin-top:30px;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container">
<div class="container-box">

<h1 class="text-center mb-4">Customer Churn Prediction</h1>

<form action="/predict" method="POST">

<div class="row">

<div class="col-md-4 mb-3">
<label>Gender</label>
<select name="gender" class="form-control">
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Senior Citizen</label>
<select name="SeniorCitizen" class="form-control">
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Partner</label>
<select name="Partner" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Dependents</label>
<select name="Dependents" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Tenure</label>
<input type="number" name="tenure" class="form-control">
</div>

<div class="col-md-4 mb-3">
<label>Phone Service</label>
<select name="PhoneService" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Multiple Lines</label>
<select name="MultipleLines" class="form-control">
<option>Yes</option>
<option>No</option>
<option>No phone service</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Internet Service</label>
<select name="InternetService" class="form-control">
<option>DSL</option>
<option>Fiber optic</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Online Security</label>
<select name="OnlineSecurity" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Online Backup</label>
<select name="OnlineBackup" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Device Protection</label>
<select name="DeviceProtection" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Tech Support</label>
<select name="TechSupport" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Streaming TV</label>
<select name="StreamingTV" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Streaming Movies</label>
<select name="StreamingMovies" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Contract</label>
<select name="Contract" class="form-control">
<option>Month-to-month</option>
<option>One year</option>
<option>Two year</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Paperless Billing</label>
<select name="PaperlessBilling" class="form-control">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Payment Method</label>
<select name="PaymentMethod" class="form-control">
<option>Electronic check</option>
<option>Mailed check</option>
<option>Bank transfer (automatic)</option>
<option>Credit card (automatic)</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Monthly Charges</label>
<input type="number" step="0.01" name="MonthlyCharges" class="form-control">
</div>

<div class="col-md-4 mb-3">
<label>Total Charges</label>
<input type="number" step="0.01" name="TotalCharges" class="form-control">
</div>

</div>

<button class="btn btn-primary w-100">
Predict
</button>

</form>

{% if prediction %}
<div class="alert alert-success mt-4">
<h4>{{ prediction }}</h4>
<h5>Probability: {{probability}}%</h5>
<h5>Risl Level:{{risk}}</h5>
<h5>Retention Suggestion: {{suggestion}}</h5>
</div>
{% endif %}

</div>
</div>

</body>
</html>
